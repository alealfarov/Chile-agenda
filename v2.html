<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CHILE Agenda 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf3f9;color:#60366e;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{margin:0;font-size:clamp(26px,5vw,40px)}h2{font-size:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button,input{font:inherit;border-radius:9px;padding:11px;border:1px solid #d3b8df}button{background:#8953a5;color:white;cursor:pointer;border:0}button:disabled{opacity:.5}form{max-width:420px;margin:28px auto;background:white;border-radius:20px;padding:26px;box-shadow:0 8px 32px #78538d14}label{display:block;margin:14px 0 5px}input{width:100%;background:#fff;color:#60366e}form button{width:100%;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:110px;border-radius:10px;background:#fff;padding:6px;overflow-wrap:anywhere;border:1px solid #eeddec}.weekday{text-align:center;font-weight:600;padding:5px}.blank{min-height:10px}.date{font-weight:700;margin:2px 0 6px}.ev{display:block;font-size:12px;line-height:1.35;border-radius:6px;padding:5px;margin:3px 0;background:#f3c9dd}.familia{background:#e9d5f5}.viaje{background:#d8c4ed}.profesional{background:#cbb1e7}.estancia{background:#f3e0ec}.tentativo{border:1px dashed #8d559d}.hint{color:#795d83;font-size:13px}.error{color:#a12756}#calendar[hidden],#login[hidden]{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.legend span{padding:5px 10px;border-radius:6px;font-size:12px}.empty{color:#927b99;font-size:12px}.event-list{display:none}@media(max-width:650px){main{padding:12px}.grid{gap:2px}.day{min-height:68px;padding:3px}.ev{font-size:10px;padding:3px}.weekday{font-size:11px}.event-list{display:block}.event-list article{background:white;margin:7px 0;border-radius:9px;padding:10px;border-left:5px solid #b98bc9}} </style></head><body><main><header><div><h1>CHILE Agenda</h1><p class="hint">Diciembre 2026 · Enero 2027 · Agenda privada</p></div><button id="logout" hidden>Cerrar sesión</button></header><section id="login"><form id="loginForm"><h2>Acceso privado</h2><p>Inicia sesión con tu cuenta autorizada.</p><label for="email">Correo electrónico</label><input id="email" type="email" required autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"><button id="enter">Acceder</button><p id="loginError" class="error" role="alert"></p><p class="hint">Solo las personas autorizadas pueden consultar la agenda. Solicita acceso a la administradora.</p></form></section><section id="calendar" hidden><div class="nav"><button id="prev" aria-label="Mes anterior">‹</button><h2 id="month"></h2><button id="next" aria-label="Mes siguiente">›</button><button id="refresh">Actualizar</button></div><p class="hint" id="session"></p><p id="notice" class="error" role="status"></p><div class="legend"><span style="background:#f3c9dd">Personal</span><span class="familia">Familia</span><span class="viaje">Viaje</span><span class="profesional">Profesional</span><span class="estancia">Estancia</span><span class="tentativo">Tentativo</span></div><div id="grid" class="grid"></div><div id="list" class="event-list"></div></section></main><script>
"use strict";const base="https://atzrgivrczzlxxqwnrwo.supabase.co",key="sb_publishable_FPGQOU31Z9wfNxKaYMAcvg_ucJRplSv";const el=id=>document.getElementById(id);let token=null,events=[],role=null,month=new Date(2026,11,1),timer=null,epoch=0;
async function request(path,opts={},auth=false){const headers={apikey:key,"Content-Type":"application/json",...(auth?{Authorization:"Bearer "+token}:{})};const r=await fetch(base+path,{...opts,headers,cache:"no-store"});if(!r.ok){const e=new Error(r.status===401?"Sesión expirada o credenciales incorrectas.":r.status===403?"Acceso no autorizado.":"No se pudo completar la solicitud ("+r.status+").");e.status=r.status;throw e;}return r.status===204?null:r.json();}
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;}
function dateStr(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function title(e){return (e.start_time?e.start_time.slice(0,5)+" · ":"")+e.title+(e.location&&e.location!==e.title?" · "+e.location:"")+(e.status==="tentativo"?" · Tentativo":"");}
function render(){const grid=el("grid"),list=el("list");grid.replaceChildren();list.replaceChildren();const y=month.getFullYear(),m=month.getMonth();el("month").textContent=new Intl.DateTimeFormat("es-CL",{month:"long",year:"numeric"}).format(month);for(const w of ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"])grid.append(node("div",w,"weekday"));for(let i=0;i<(month.getDay()+6)%7;i++)grid.append(node("div",null,"blank"));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const day=node("div",null,"day");day.append(node("div",String(d),"date"));const ds=dateStr(y,m,d);for(const e of events.filter(x=>x.start_date<=ds&&x.end_date>=ds)){const t=node("div",title(e),"ev "+e.category+(e.status==="tentativo"?" tentativo":""));if(e.description)t.title=e.description;day.append(t);}grid.append(day);}const first=dateStr(y,m,1),last=dateStr(y,m,new Date(y,m+1,0).getDate());for(const e of events.filter(x=>x.start_date<=last&&x.end_date>=first)){const a=node("article");a.append(node("strong",title(e)),node("p",e.start_date+(e.end_date!==e.start_date?" — "+e.end_date:"")+(e.all_day?" · Todo el día":" · "+e.timezone),"hint"));list.append(a);}}
function reset(){epoch++;token=null;events=[];role=null;clearInterval(timer);timer=null;el("grid").replaceChildren();el("list").replaceChildren();el("calendar").hidden=true;el("logout").hidden=true;el("login").hidden=false;el("password").value="";}
async function load(){const generation=epoch;try{const rows=await request("/rest/v1/agenda_events?select=*&order=start_date.asc,start_time.asc.nullsfirst",{},true);if(generation!==epoch)return;events=rows;render();el("notice").textContent="";}catch(e){if(generation!==epoch)return;if(e.status===401){reset();el("loginError").textContent="Tu sesión expiró. Inicia sesión nuevamente.";}else el("notice").textContent=e.message;}}
el("loginForm").addEventListener("submit",async e=>{e.preventDefault();el("enter").disabled=true;el("loginError").textContent="";try{const session=await request("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:el("email").value,password:el("password").value})});token=session.access_token;const members=await request("/rest/v1/agenda_members?select=role",{},true);if(members.length!==1){reset();throw new Error("Cuenta sin autorización para esta agenda.");}role=members[0].role;el("password").value="";el("session").textContent=role==="admin"?"Administradora · Gestión mediante ChatGPT":"Invitado · Solo lectura";el("login").hidden=true;el("calendar").hidden=false;el("logout").hidden=false;await load();if(token)timer=setInterval(load,30000);}catch(e){reset();el("loginError").textContent=e.message;}finally{el("enter").disabled=false;}});
el("logout").onclick=async()=>{const t=token;reset();if(t)try{await fetch(base+"/auth/v1/logout?scope=local",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+t}});}catch{}};el("prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};el("next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};el("refresh").onclick=load;document.addEventListener("visibilitychange",()=>{if(!document.hidden&&token)load()});
</script></body></html>
